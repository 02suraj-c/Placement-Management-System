server.port=8080
spring.application.name=placement-management-system

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/placement_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:local-development-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256}
jwt.expiration-ms=86400000

# File Upload & Storage Configuration
file.upload-dir=uploads/resumes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# AI Configuration (Gemini)
ai.provider=gemini
ai.api-key=${AI_API_KEY:}
ai.model=gemini-2.0-flash
ai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
ai.timeout-seconds=30
ai.max-retries=2
