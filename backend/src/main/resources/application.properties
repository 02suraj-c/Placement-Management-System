server.port=8080
spring.application.name=placement-management-system

# DB credentials MUST be supplied via environment variables — no insecure fallbacks
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/placement_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
# SECURITY: show-sql must be false in production to prevent PII/credential leakage in logs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SECURITY: JWT_SECRET MUST be supplied via environment variable — no default allowed in production
# Generate a strong secret: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# File Upload & Storage Configuration
file.upload-dir=uploads/resumes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# AI Configuration (Gemini)
ai.provider=gemini
ai.api-key=${AI_API_KEY:}
ai.model=gemini-2.0-flash
ai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
ai.timeout-seconds=30
ai.max-retries=2

# SECURITY: Restrict actuator — only expose health for load-balancer probes
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator
