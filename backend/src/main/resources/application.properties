# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/placement_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── Server ─────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── JWT (stub — populated in step 2) ──────────────────────────────────────────
jwt.secret=${JWT_SECRET:changeme-at-least-256-bits-long-random-string}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── AI Provider (populated in step 2) ─────────────────────────────────────────
ai.provider=${AI_PROVIDER:openai}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:gpt-4o-mini}
ai.base-url=${AI_BASE_URL:https://api.openai.com/v1/chat/completions}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}
ai.max-retries=${AI_MAX_RETRIES:3}

# ── File Upload ────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Actuator ───────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.placement=INFO
logging.level.org.springframework.security=WARN
