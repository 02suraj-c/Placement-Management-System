server.port=8080
spring.application.name=placement-management-system

# ---- Local Dev: Use embedded H2 database (no MySQL required) ----
spring.datasource.url=jdbc:h2:mem:placement_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Dev JWT secret (do NOT use in production)
jwt.secret=ZGV2LXNlY3JldC1rZXktZm9yLWxvY2FsLXRlc3Rpbmctb25seS1wbGVhc2UtY2hhbmdlLWluLXByb2R1Y3Rpb24=
jwt.expiration-ms=86400000

# File Upload & Storage Configuration
file.upload-dir=uploads/resumes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# AI Configuration (Gemini)
ai.provider=gemini
ai.api-key=${AI_API_KEY:dummy-key-for-local-dev}
ai.model=gemini-2.0-flash
ai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
ai.timeout-seconds=30
ai.max-retries=2

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator
