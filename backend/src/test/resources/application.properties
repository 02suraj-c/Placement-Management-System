# Test configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

ai.provider=gemini
ai.api-key=test-api-key-for-testing-only
ai.model=gemini-2.0-flash
ai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
ai.timeout-seconds=5
ai.max-retries=2

jwt.secret=testing-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256-signing
jwt.expiration-ms=86400000

file.upload-dir=target/test-uploads/resumes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
